[package]
name = "veloxvpn"
version = "0.2.0"
edition = "2021"
description = "A lightweight Rust VPN/proxy supporting VLESS, AnyTLS and TUIC with a local web UI"
license = "MIT"

[[bin]]
name = "veloxvpn"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-rustls = "0.26"
rustls = "0.23"
rcgen = "0.13"
quinn = "0.11"
bytes = "1"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
argon2 = "0.5"
urlencoding = "2"
sha2 = "0.10"
hex = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
axum = { version = "0.7", features = ["ws"] }
tokio-tungstenite = { version = "0.24", features = ["connect", "handshake", "url", "rustls-tls-webpki-roots"] }
tempfile = "3"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
